name: CI

on:
  push:
    branches: [main]
  pull_request:

# دفعة جديدة على نفس الفرع تلغي التشغيل القديم
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# الـ repo عام (2026-11-22): pull_request فقط (لا pull_request_target)، فـ PR من fork يعمل بـ token قراءة فقط وبلا
# أسرار؛ الـ workflow نفسه لا يستعمل أي secret. لا تضف أسراراً هنا ولا pull_request_target أبداً (RUNBOOK §18).
permissions:
  contents: read

# الـ actions مثبّتة بـ commit SHA (الوسم بالتعليق) حتى لا يتغير ما يُشغَّل بدون مراجعة.
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # كل حزم الـ workspace (shared، customer، driver، admin): lint بالجذر، وtypecheck/test بـ pnpm -r
      - name: Lint (eslint + prettier, whole repo incl. apps/driver)
        run: pnpm lint
      - name: Typecheck (shared, customer, driver, admin)
        run: pnpm typecheck
      - name: Unit tests (shared, customer, driver, admin + scripts)
        run: pnpm test
      - name: Driver app is part of the recursive run (T30)
        run: pnpm -r ls --depth -1 | grep -q '@mukhdar/driver'
      - name: Edge Functions (deno check + deno test, fetch mocked)
        run: pnpm test:functions

  # معاينة المالك على Cloudflare: يبني الهدفين على Linux (البناء على ويندوز لا يعمل لـ OpenNext). بلا نشر وبلا أسرار.
  web-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # قيم عامة وهمية لتجاوز فحص الإعداد وقت البناء (المفاتيح الحقيقية تُضبط بـ Cloudflare)
      EXPO_PUBLIC_SUPABASE_URL: https://ghcohlrzvehtcettaaiu.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_placeholder
      # T38: مفتاح VAPID **عام** وهمي (مثال web-push) ليظهر مسار Web Push بالبناء/Playwright؛ لا علاقة له بمفتاح dev
      EXPO_PUBLIC_VAPID_PUBLIC_KEY: BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U
      NEXT_PUBLIC_SUPABASE_URL: https://ghcohlrzvehtcettaaiu.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Customer PWA (expo export -p web)
        run: pnpm --filter @mukhdar/customer run export:web
      # R1 L7: خطأ تجميع Metro أو app.config.ts بتطبيق السائق يظهر هنا لا ببناء EAS (T32/T33). بلا EAS ولا أسرار.
      - name: Driver app (expo export -p android, bundle check only)
        run: pnpm --filter @mukhdar/driver run export:android
      # T37: PWA السائق (نفس أمر بناء Cloudflare Pages mukhdar-driver). postexport يحسب هاش CSP ويفشل إن وجد بالـ bundle
      # service_role أو sb_secret_ أو مفتاحاً خاصاً (scripts/check-web-bundle.mjs).
      - name: Driver PWA (expo export -p web + CSP hash + secret scan)
        run: pnpm --filter @mukhdar/driver run export:web
      - name: Driver PWA Playwright browsers
        working-directory: apps/driver
        run: pnpm exec playwright install --with-deps chromium webkit
      # بلا خادم: manifest، الرؤوس، RTL، بوابة التثبيت، لا أخطاء CSP (login.spec.ts يتخطّى بالمفتاح الوهمي)
      - name: Driver PWA Playwright (WebKit iPhone + Chromium Android)
        working-directory: apps/driver
        env:
          E2E_SKIP_BUILD: '1'
        run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: driver-pwa-playwright
          path: apps/driver/test-results
          retention-days: 7
      # R3 L7: PWA الزبون بلا خادم (manifest، CSP بلا unsafe-inline، sw.js بلا كاش، RTL، لا أخطاء CSP). المتصفحات من الخطوة السابقة.
      - name: Customer PWA Playwright static (WebKit iPhone + Chromium Android)
        working-directory: apps/customer
        env:
          E2E_SKIP_BUILD: '1'
        run: pnpm exec playwright test -c playwright.static.config.ts
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: customer-pwa-playwright
          path: apps/customer/test-results
          retention-days: 7
      - name: Admin on Cloudflare (OpenNext build)
        run: pnpm --filter @mukhdar/admin run build:cf
      - name: MEASURE ONLY admin worker size (wrangler dry run, no deploy)
        working-directory: apps/admin
        run: |
          pnpm exec wrangler deploy --dry-run --outdir /tmp/wdry 2>&1 | tail -20
          ls -la .open-next/worker.js /tmp/wdry | head -20
          du -sk .open-next/assets .open-next/server-functions .open-next/middleware 2>/dev/null

  # اختبارات pgTAP على Supabase محلي (Docker على الـ runner). لا اتصال بالسحابة ولا كلمة سر.
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (Postgres + Auth + Storage, migrations applied)
        timeout-minutes: 10
        run: >-
          pnpm exec supabase start
          -x realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: pgTAP (seed.sql only)
        run: pnpm db:test
      - name: Concurrency (40 orders on stock 10; 8 drivers accept one order; 4 parallel outbox claims)
        run: pnpm db:concurrency
      - name: seed:demo (500 orders over 30 days + 1000 load customers)
        run: pnpm seed:demo --scale=load --no-images
      - name: pgTAP (with demo data; 09 = daily_stats matches orders)
        run: pnpm db:test
      - name: Report RPC speed (T20; one year, 200k orders, rolled back)
        run: pnpm db:report-perf
      - name: seed:reset, then check again
        run: pnpm seed:reset && pnpm db:test 09
      - name: seed:demo refuses a non-local target (and says why)
        run: |
          set +e
          out=$(DB_URL=postgresql://postgres:x@db.example.com:5432/postgres pnpm seed:demo 2>&1)
          code=$?
          echo "$out"
          test "$code" -ne 0 && echo "$out" | grep -q 'Refusing: DB_URL host db.example.com is not local'
      - name: db:concurrency refuses a remote target
        run: |
          set +e
          out=$(pnpm db:concurrency --remote 2>&1)
          code=$?
          echo "$out"
          test "$code" -ne 0 && echo "$out" | grep -q 'Refusing: db:concurrency'
      - if: always()
        run: pnpm exec supabase stop --no-backup

  # لوحة الأدمن (T16+): Playwright ضد Supabase محلي (Auth + REST) ببيانات seed:demo وحسابات العرض.
  # لا سحابة ولا أسرار: المفتاح هو anon المحلي من supabase status.
  admin-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # edge-runtime: admin-reset-pin وadmin-create-user (T19) تُخدم محلياً من supabase/functions
      - name: Start local Supabase (Postgres + Auth + REST + Realtime + Storage + Edge Functions via Kong)
        timeout-minutes: 10
        run: >-
          pnpm exec supabase start
          -x imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor
      - name: seed:demo (demo admin, staff, drivers, customers with DEMO_PIN)
        run: pnpm seed:demo --no-images
      - name: Local Supabase URL and anon key for the admin app
        run: |
          eval "$(pnpm exec supabase status -o env 2>/dev/null | grep -E '^(API_URL|ANON_KEY)=')"
          test -n "$API_URL" && test -n "$ANON_KEY"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Auth smoke (demo admin signs in with phone + PIN; prints status and error code only)
        run: |
          code=$(curl -sS -o /tmp/auth.json -w '%{http_code}'             "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/token?grant_type=password"             -H "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" -H 'content-type: application/json'             -d '{"phone":"+9647000000001","password":"482915"}')
          echo "HTTP $code"
          jq -c 'del(.access_token, .refresh_token, .user)' /tmp/auth.json
          test "$code" = 200
      - name: Playwright browser
        working-directory: apps/admin
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (access, orders, catalog, settings/staff/addresses/driver-requests incl. Edge Functions)
        env:
          # الطلبات التجريبية تُنشأ وتُعدَّل هنا فقط (Supabase محلي)، لا على mukhdar-dev
          E2E_ALLOW_WRITES: '1'
        run: pnpm --filter @mukhdar/admin test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/admin/playwright-report
          retention-days: 7
      - if: always()
        run: pnpm exec supabase stop --no-backup
